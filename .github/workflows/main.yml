name: Android Debug APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/cmdline-tools/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Accept licenses and install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.1.0"

      - name: Install Gradle 8.7
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7-bin.zip
          unzip -q /tmp/gradle-8.7-bin.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Download Hy-MT model asset
        run: |
          mkdir -p app/src/main/assets/hy_mt
          curl -L --fail --retry 3 --max-time 7200 \
            -o app/src/main/assets/hy_mt/Hy-MT1.5-1.8B-1.25bit.gguf \
            'https://modelscope.cn/models/AngelSlim/Hy-MT1.5-1.8B-1.25bit-GGUF/resolve/master/Hy-MT1.5-1.8B-1.25bit.gguf'
          stat -c '%n %s bytes' app/src/main/assets/hy_mt/Hy-MT1.5-1.8B-1.25bit.gguf

      - name: Download sherpa-onnx AAR (offline TTS engine)
        run: |
          mkdir -p app/libs
          curl -L --fail --retry 3 --max-time 1800 \
            -o app/libs/sherpa-onnx.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          ls -lh app/libs/sherpa-onnx.aar
          echo "=== AAR 中的 TTS 类与 native 库 ==="
          unzip -l app/libs/sherpa-onnx.aar | grep -i -E "OfflineTts|classes.jar" | head -20
          unzip -l app/libs/sherpa-onnx.aar | grep -E "\.so$" | head -20

      - name: Download offline TTS models (Chinese + English)
        run: |
          mkdir -p /tmp/tts-models
          cd /tmp/tts-models
          curl -L --fail --retry 3 --max-time 1800 -o zh.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-zh_CN-xiao_ya-medium-int8.tar.bz2
          curl -L --fail --retry 3 --max-time 1800 -o en.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-lessac-medium-int8.tar.bz2
          tar -xjf zh.tar.bz2
          tar -xjf en.tar.bz2
          ls -d vits-piper-*
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets/tts"
          rm -rf "$GITHUB_WORKSPACE/app/src/main/assets/tts/zh" "$GITHUB_WORKSPACE/app/src/main/assets/tts/en"
          mv vits-piper-zh_CN-xiao_ya-medium-int8 "$GITHUB_WORKSPACE/app/src/main/assets/tts/zh"
          mv vits-piper-en_US-lessac-medium-int8 "$GITHUB_WORKSPACE/app/src/main/assets/tts/en"
          echo "=== 打包进 APK 的语音模型 ==="
          du -sh "$GITHUB_WORKSPACE/app/src/main/assets/tts/zh" "$GITHUB_WORKSPACE/app/src/main/assets/tts/en"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fanyiapp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
